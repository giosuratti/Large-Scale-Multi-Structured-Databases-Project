# ==========================================
# 1. MONGODB CONFIGURATION (REPLICA SET)
# ==========================================
# Connects to the 3-node replica set. The primary node is automatically resolved.
spring.data.mongodb.uri=mongodb://10.1.1.91:27017,10.1.1.90:27017,10.1.1.92:27017/findyourdoc?replicaSet=lsmdb&w=majority&readPreference=primary

# Automatically creates indexes defined in the document entities
spring.data.mongodb.auto-index-creation=true

# ==========================================
# 2. NEO4J CONFIGURATION
# ==========================================
# Connects to the Neo4j instance via the Bolt protocol on the .90 node
spring.neo4j.uri=bolt://10.1.1.90:7687
spring.data.neo4j.database=neo4j

# Database credentials
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=findyourdoc

# ==========================================
# 3. REDIS CONFIGURATION (CLUSTER)
# ==========================================
# Connects to the Redis Cluster across the three nodes
spring.data.redis.cluster.nodes=10.1.1.90:6379,10.1.1.91:6379,10.1.1.92:6379

# Maximum cluster redirects when resolving hash slots
spring.data.redis.cluster.max-redirects=3

# Connection timeout in milliseconds
spring.data.redis.timeout=2000

# ==========================================
# 4. JWT SECURITY CONFIGURATION
# ==========================================
# Secret key used for signing JWTs
jwt.secret-key=mariogiovannicosimoantoniocimino
# Token validity duration (1 hour)
jwt.validity-in-milliseconds=3600000

# ==========================================
# 5. LOGGING AND SWAGGER CONFIGURATION
# ==========================================
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.org.springframework.data.neo4j=INFO
logging.level.org.springframework.data=INFO
logging.level.org.springframework.web=INFO

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.path=/swagger-ui.html