# ===============================
# 1. CONFIGURAZIONE MONGODB (REPLICA SET)
# ===============================
# Puntiamo ai tre nodi. MongoDB riconoscerà automaticamente chi è il Primary.
# La porta è la 27017 come hai confermato nell'ultimo passaggio.
spring.data.mongodb.uri=mongodb://10.1.1.91:27017,10.1.1.90:27017,10.1.1.92:27017/findyourdoc?replicaSet=rs0&w=majority&readPreference=primary

spring.data.mongodb.auto-index-creation=true

# ===============================
# 2. CONFIGURAZIONE NEO4J (VM .90)
# ===============================
# Neo4j gira sulla macchina .90. Usiamo il protocollo bolt.
spring.neo4j.uri=bolt://10.1.1.90:7687
spring.data.neo4j.database=neo4j

# La password che hai impostato durante la pulizia del DB
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=findyourdoc

# ===============================
# 3. CONFIGURAZIONE REDIS (CLUSTER - Coerente con PDF)
# ===============================
# Non usiamo più host/port singoli, ma la configurazione Cluster (Slide 22-24 del PDF)
spring.data.redis.cluster.nodes=10.1.1.90:6379,10.1.1.91:6379,10.1.1.92:6379

# Numero massimo di reindirizzamenti quando una chiave è su un altro slot (Hash Slots)
spring.data.redis.cluster.max-redirects=3

# Timeout connessione
spring.data.redis.timeout=2000

# ===============================
# CONFIGURAZIONE SECURITY JWT
# ===============================
jwt.secret-key=mariogiovannicosimoantoniocimino
jwt.validity-in-milliseconds=3600000

# ===============================
# 4. LOGGING E SWAGGER
# ===============================
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.neo4j=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.springframework.web=DEBUG

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.path=/swagger-ui.html