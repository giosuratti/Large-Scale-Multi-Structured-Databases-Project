

# ===============================
# 1. CONFIGURAZIONE MONGODB (LOCALE)
# ===============================
# Di default Mongo locale non ha password. Se ne hai messa una, il formato :
# mongodb://user:password@localhost:27017/findyourdoc
spring.data.mongodb.uri=mongodb://localhost:27017/findyourdoc?w=majority&readPreference=primary

# Evita errori sulle transazioni se Mongo non in modalita' replica set (comune in locale)
spring.data.mongodb.auto-index-creation=true

# ===============================
# 2. CONFIGURAZIONE NEO4J (LOCALE)
# ===============================
# Protocollo 'bolt' su localhost porta 7687
spring.neo4j.uri=bolt://localhost:7687
spring.data.neo4j.database=neo4j

# ATTENZIONE: Questi dati dipendono da cosa hai impostato tu.
# Appena installi Neo4j, devi aprire il browser (http://localhost:7474),
# loggarti con "neo4j"/"neo4j" e ti obblighera' a cambiare la password.
# Metti qui la NUOVA password che hai scelto.
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=aranciofebbo

# ===============================
# 3. CONFIGURAZIONE REDIS (LOCALE)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Se hai installato Redis senza password (default su molte installazioni locali), lascia vuoto o commenta:
# spring.data.redis.password=

# Timeout connessione
spring.data.redis.timeout=2000

# ===============================
# CONFIGURAZIONE SECURITY JWT
# ===============================
# La chiave deve essere una stringa lunga e sicura
jwt.secret-key=mariogiovannicosimoantoniocimino
# Validita' del token in millisecondi (es. 3600000 = 1 ora)
jwt.validity-in-milliseconds=3600000


# ===============================
# 4. LOGGING
# ===============================
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.data.neo4j=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.org.springframework.web=DEBUG


spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springdoc.swagger-ui.use-root-path=true
springdoc.swagger-ui.path=/swagger-ui.html
